<!doctype html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spot Trade · CRYPTXchange</title><link rel="icon" href="assets/img/favicon.png">
<script>try{document.documentElement.setAttribute('data-bs-theme',localStorage.getItem('cx_theme')||'dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet"></head>
<body data-page="spot" data-layout="auto" data-flush="1"><div id="page">

<div class="tr-grid spot-grid" id="trade" data-mode="spot">
<div class="tr-panel"><h6>Order Book <span class="float-end text-muted">0.01</span></h6><div class="ob-row ob-head"><span>Price (USDT)</span><span>Amount (BTC)</span><span>Total</span></div><div id="obAsk"></div><div class="ob-mid" id="obMid"></div><div id="obBid"></div></div>
<div class="d-grid gap-2" style="min-width:0;align-content:start">
<div class="tr-panel"><div class="d-flex flex-wrap gap-3 align-items-center mb-2"><div><b class="fs-6" id="pairName">BTC/USDT</b><div class="text-muted" style="font-size:.7rem" id="pairFull">Bitcoin price</div></div><b class="fs-5" id="lastPrice">-</b>
<div><div class="text-muted" style="font-size:.7rem">24h Change</div><span id="h24c"></span></div><div><div class="text-muted" style="font-size:.7rem">24h High</div><span id="h24h"></span></div><div><div class="text-muted" style="font-size:.7rem">24h Low</div><span id="h24l"></span></div><div class="d-none d-sm-block"><div class="text-muted" style="font-size:.7rem">24h Volume</div><span id="h24v"></span></div></div>
<div class="d-flex gap-2 mb-2 flex-wrap" id="tfBtns"><button class="btn btn-sm btn-outline-secondary" data-tf="15m">15m</button><button class="btn btn-sm btn-soft" data-tf="1H">1H</button><button class="btn btn-sm btn-outline-secondary" data-tf="4H">4H</button><button class="btn btn-sm btn-outline-secondary" data-tf="1D">1D</button><button class="btn btn-sm btn-outline-secondary" data-tf="1W">1W</button></div><canvas class="chart" id="chart"></canvas></div>
<div class="tr-panel"><div class="tr-tabs" id="spotTabs"><button class="active" data-t="Limit">Limit</button><button data-t="Market">Market</button><button data-t="Stop-limit">Stop-limit</button></div>
<div class="row g-3"><div class="col-md-6"><form class="spotForm" data-side="Buy" novalidate><div class="d-flex justify-content-between text-muted mb-1"><span>Avail</span><span class="avl">12,480.50 USDT</span></div>
<div class="input-group input-group-sm mb-2 stopRow d-none"><span class="input-group-text">Stop</span><input type="number" step="any" class="form-control f-stop"><span class="input-group-text">USDT</span></div>
<div class="input-group input-group-sm mb-2 priceRow"><span class="input-group-text">Price</span><input type="number" step="any" class="form-control f-price"><span class="input-group-text">USDT</span></div>
<div class="input-group input-group-sm mb-2"><span class="input-group-text">Amount</span><input type="number" step="any" class="form-control f-amt"><span class="input-group-text u-sym">BTC</span></div>
<input type="range" class="form-range range-sm f-rng" min="0" max="100" step="25" value="0"><div class="d-flex justify-content-between text-muted mb-2"><span>Total ≈ <b class="f-tot">0.00</b> USDT</span></div>
<button class="btn btn-up w-100">Buy</button></form></div>
<div class="col-md-6"><form class="spotForm" data-side="Sell" novalidate><div class="d-flex justify-content-between text-muted mb-1"><span>Avail</span><span class="avl">0.4821 BTC</span></div>
<div class="input-group input-group-sm mb-2 stopRow d-none"><span class="input-group-text">Stop</span><input type="number" step="any" class="form-control f-stop"><span class="input-group-text">USDT</span></div>
<div class="input-group input-group-sm mb-2 priceRow"><span class="input-group-text">Price</span><input type="number" step="any" class="form-control f-price"><span class="input-group-text">USDT</span></div>
<div class="input-group input-group-sm mb-2"><span class="input-group-text">Amount</span><input type="number" step="any" class="form-control f-amt"><span class="input-group-text u-sym">BTC</span></div>
<input type="range" class="form-range range-sm f-rng" min="0" max="100" step="25" value="0"><div class="d-flex justify-content-between text-muted mb-2"><span>Total ≈ <b class="f-tot">0.00</b> USDT</span></div>
<button class="btn btn-down w-100">Sell</button></form></div></div></div></div>
<div class="d-grid gap-2 col-r" style="align-content:start;min-width:0"><div class="tr-panel"><input class="form-control form-control-sm mb-2" id="pairSearch" placeholder="Search"><div class="tr-tabs"><button class="active">USDT</button><button>USDC</button><button>BNB</button></div><div class="pair-row text-muted"><span>Pair</span><span class="text-end">Price</span><span class="text-end">Change</span></div><div class="tr-scroll" style="max-height:200px" id="pairList"></div></div>
<div class="tr-panel"><div class="tr-tabs" id="mtTabs"><button class="active" data-t="Market Trades">Market Trades</button><button class="" data-t="My Trades">My Trades</button></div><div class="pair-row text-muted"><span>Price</span><span class="text-end">Amount</span><span class="text-end">Time</span></div><div class="tr-scroll" style="max-height:220px" id="mTrades"></div></div>
<div class="tr-panel"><h6>Top Movers</h6><div id="movers"></div></div></div>
<div class="tr-panel" style="grid-column:1/-1"><div class="tr-tabs" id="ordTabs"><button class="active" data-t="Open Orders">Open Orders</button><button class="" data-t="Order History">Order History</button><button class="" data-t="Cancel History">Cancel History</button></div><div id="ordTable"></div></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/pages.js"></script><script src="assets/js/trade.js"></script></body></html>
